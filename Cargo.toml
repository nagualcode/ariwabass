[package]
name = "ariwa-bass"
version = "1.0.0"
edition = "2024"
authors = ["nagualcode"]
description = "Ariwa Bass: 1980s/90s Mad Professor (Neil Fraser) Ariwa Studios sweet psychedelic 'ronca e desliza' dub bass processor built with Truce"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nagualcode/ariwabass"
keywords = ["audio", "plugin", "vst3", "clap", "dub"]
categories = ["multimedia::audio"]

[lib]
name = "ariwa_bass"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "ariwa-bass-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
lv2 = ["dep:truce-lv2"]
aax = ["dep:truce-aax"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
truce-core = { version = "6.3" }
truce-params = { version = "6.3" }
truce-egui = { version = "6.3" }
egui = "0.34"
truce-loader = { version = "6.3" }
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-vst2 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-lv2 = { version = "6.3", optional = true }
truce-aax = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
truce-test = { version = "6.3" }
truce-driver = { version = "6.3" }
truce-build = { version = "6.3" }
truce-utils = { version = "6.3" }
hound = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.shell]
inherits = "release"

[patch.crates-io]
truce-clap = { path = "vendor/truce-clap" }

